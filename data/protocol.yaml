# 인터뷰 Task 정의. build_index.py가 이 파일을 web/data/protocol.json으로 바꿔 앱에 넣는다.
# 문구나 대상을 바꾸면 version을 올린다(로그의 protocol_version으로 남는다).
version: p3

# Task는 세 개다.
#   T1  원래 방식: 중고거래 앱처럼 목록을 내려 보거나 검색해서, 사진 속 굿즈를 가장 싸게 파는 게시물을 찾는다
#   T2  제안 방식: 같은 화면에 사진 검색이 있다. 같은 일을 사진 검색으로 한다
#   T3  구매 추천: 마음에 드는 굿즈 5개를 찜하면, 찜 목록을 바탕으로 비슷한 계열의 굿즈를 추천하는 페이지가 열린다
#
# type
#   find_cheapest  대상 굿즈를 가장 싸게 파는 게시물을 골라 [이걸로 살래요]를 누른다.
#                  같은 상품이 가격·문구를 달리해 여러 개 있고(data/extra_posts.yaml), 판매가와 본문 가격이 다른 게시물,
#                  1원짜리 일괄 판매 게시물이 섞여 있다. 정답은 실제 가격(real_prices)이 가장 낮은 게시물이다
#   recommend      굿즈 n_likes개를 찜한 뒤 [구매 추천 보기] → 추천된 굿즈 중 사고 싶은 것을 찜한다
# modules: 여는 화면 (A 원래 방식 검색, P 원래 방식 + 사진 검색, R 구매 추천)
# condition_label: 화면 위 칩에 쓸 이름(없으면 "원래 방식" / "제안 방식")
tasks:
  T1:
    type: find_cheapest
    name: 원래 방식으로 찾기
    instruction: "아래 사진 속 굿즈를 가장 싸게 파는 게시물을 찾아 주세요. 평소 중고거래 앱에서 하듯이 목록을 내려 보거나 검색해서 찾으면 됩니다. 찾으면 그 게시물에서 [이걸로 살래요]를 누르고 [완료]를 눌러 주세요."
    modules: {classic: A}
    show_card_image: true
  T2:
    type: find_cheapest
    name: 사진으로 찾기
    instruction: "이번에는 저희가 제안하는 방식입니다. 검색창 옆의 [사진] 버튼으로 사진을 불러와 굿즈를 찾을 수 있습니다. 아래 사진 속 굿즈를 가장 싸게 파는 게시물을 찾아 [이걸로 살래요]를 누르고 [완료]를 눌러 주세요. 같은 사진이 갤러리의 가장 최근 사진으로 들어 있습니다."
    modules: {ai: P}
    show_card_image: true
  T3:
    type: recommend
    name: 구매 추천 받기
    condition_label: 구매 추천
    instruction: "목록을 둘러보며 마음에 드는 굿즈를 5개 찜해 주세요(게시물을 열고 [♡ 찜]). 5개를 찜하면 위의 [구매 추천 보기]가 켜집니다. 추천 페이지에서 사고 싶은 굿즈가 있으면 찜하고, 다 보셨으면 [완료]를 눌러 주세요."
    modules: {ai: R}
    n_likes: 5
    n_recommend: 8

# 진행 순서(고정): 원래 방식 → 제안 방식(사진 검색) → 추천
sequence:
  runs:
    - {task: T1, condition: classic, set: X}
    - {task: T2, condition: ai, set: Y}
    - {task: T3, condition: ai}

# 세션 마지막에 묻는 선택 질문 (pref_find: 원래 방식 / 사진 검색 중 고르기)
final_questions: [pref_find]

# Task 대상. T1과 T2는 서로 다른 상품을 쓴다(같은 상품이면 T1에서 찾은 것을 기억해 T2를 풀게 된다).
#   product_key        정답 상품 그룹 (data/posts.json의 product_key)
#   card_image_source  대상 사진(data/images의 id). 안내문에 보이고 가상 갤러리의 가장 최근 사진으로 들어간다. 게시물에서는 빠진다
targets:
  X:
    T1: {target_id: figma-003-saber-armor, product_key: figma-003-saber-armor, card_image_source: img_0056}
  Y:
    T2: {target_id: revoltech-danboard-amazon, product_key: revoltech-danboard-amazon, card_image_source: img_0098}
