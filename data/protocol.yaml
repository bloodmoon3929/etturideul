# 인터뷰 Task 정의. build_index.py가 이 파일을 web/data/protocol.json으로 바꿔 앱에 넣는다.
# 문구나 대상을 바꾸면 version을 올린다(로그의 protocol_version으로 남는다).
version: p2

# Task는 세 개다. 앞의 둘은 "정확히 찾고 싶은 것을 찾는 방법", 마지막은 추천이다.
#   T1  원래 방식: 중고거래 앱처럼 목록을 내려 보거나 검색해서 찾는다
#   T2  제안 방식: 같은 화면에 사진 검색이 있다면
#   T3  추천: 마음에 드는 굿즈를 고르면 비슷한 굿즈가 추천되는가
#
# type
#   find_same   사진 속 굿즈와 같은 상품을 찾아 [이 상품이에요]를 누른다
#   recommend   굿즈를 고르면 비슷한 굿즈가 추천된다. 마음에 드는 것을 찜한다
# modules: 여는 화면 (A 원래 방식 검색, P 원래 방식 + 사진 검색, R 비슷한 굿즈 추천)
tasks:
  T1:
    type: find_same
    name: 원래 방식으로 찾기
    instruction: "아래 사진 속 굿즈와 같은 상품을 찾아 주세요. 평소 중고거래 앱에서 하듯이 목록을 내려 보거나 검색해서 찾으면 됩니다. 찾으면 [이 상품이에요]를 누르고 [완료]를 눌러 주세요."
    modules: {classic: A}
    show_card_image: true
  T2:
    type: find_same
    name: 사진으로 찾기
    instruction: "이번에는 저희가 제안하는 방식입니다. 검색창 옆의 [사진] 버튼으로 사진을 불러와 굿즈를 찾을 수 있습니다. 아래 사진 속 굿즈와 같은 상품을 찾아 [이 상품이에요]를 누르고 [완료]를 눌러 주세요. 같은 사진이 갤러리의 가장 최근 사진으로 들어 있습니다."
    modules: {ai: P}
    show_card_image: true
  T3:
    type: recommend
    name: 비슷한 굿즈 추천
    instruction: "목록에서 마음에 드는 굿즈를 하나 골라 눌러 보세요. 그 굿즈와 비슷한 굿즈를 아래에 추천해 드립니다. 추천된 굿즈 중 마음에 드는 것이 있으면 찜하고, 다 보셨으면 [완료]를 눌러 주세요."
    modules: {ai: R}

# 진행 순서(고정): 원래 방식 → 제안 방식(사진 검색) → 추천
sequence:
  runs:
    - {task: T1, condition: classic, set: X}
    - {task: T2, condition: ai, set: Y}
    - {task: T3, condition: ai}

# 세션 마지막에 묻는 선택 질문 (pref_find: 원래 방식 / 사진 검색 중 고르기)
final_questions: [pref_find]

# Task 대상. T1과 T2는 서로 다른 상품을 쓴다(같은 상품이면 T1에서 찾은 것을 기억해 T2를 풀게 된다).
#   product_key        정답 상품 그룹 (data/posts.json의 product_key)
#   card_image_source  대상 사진(data/images의 id). 안내문에 보이고 가상 갤러리의 가장 최근 사진으로 들어간다. 게시물에서는 빠진다
targets:
  X:
    T1: {target_id: figma-003-saber-armor, product_key: figma-003-saber-armor, card_image_source: img_0056}
  Y:
    T2: {target_id: revoltech-danboard-amazon, product_key: revoltech-danboard-amazon, card_image_source: img_0098}
