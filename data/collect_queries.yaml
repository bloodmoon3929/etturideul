  - {q: "hello kitty plush", category: 인형, series: 산리오, group: hellokitty-plush}
  - {q: "anime plush doll", category: 인형}

# ── 가상 갤러리용 일상 사진 (scripts/make_gallery.py) ─────────────────
# 과업에서 "사진으로 찾기"를 할 때 폰 갤러리처럼 보이는 화면에 깔아 두는 사진이다.
# 과업 대상 사진이 이 사진들보다 앞(가장 최근)에 놓인다. 사람이 나오지 않는 사진만 쓴다.
# 라이선스는 CC0 / Public Domain만 받는다. skip에 Openverse id를 적으면 그 사진은 건너뛴다.
gallery:
  queries:
    - "latte coffee cup"
    - "sunset sky clouds"
    - "cat sleeping"
    - "ramen bowl"
    - "city street night lights"
    - "laptop desk workspace"
    - "flowers bouquet"
    - "mountain lake landscape"
    - "dog on grass"
    - "bookshelf books"
    - "bicycle parked"
    - "beach waves"
  skip: []
  # 대상 사진만 굿즈라 티가 나지 않도록 섞어 두는 다른 굿즈 사진(data/images의 id).
  # 게시물로 쓰지 않은 사진 중 얼굴·워터마크가 없고 Task 대상(세이버, 단보)과 다른 시리즈만 골랐다.
  goods: [img_0361, img_0176, img_0303, img_0341, img_0414, img_0200]
