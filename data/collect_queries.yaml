  # ── 인형 ───────────────────────────────────────────
  - {q: "totoro plush", category: 인형, series: 이웃집 토토로, group: totoro-plush}
  - {q: "pikachu plush", category: 인형, series: 포켓몬스터, group: pikachu-plush}
