# 사진 수집 검색어 (PLAN 4.3.1)
# category : 검수 화면에 미리 채워 둘 카테고리 (검수자가 바꿀 수 있음)
# series   : 시리즈 힌트 (검수자가 확정)
# group    : 같은 상품 그룹(product_key) 후보 힌트. 서로 다른 사람이 찍은 같은 상품 사진을 모으기 위한 것
# pages    : 가져올 페이지 수 (Openverse 익명 한도: 분당 20회, 하루 200회, 페이지당 20장)
defaults:
  pages: 1
  page_size: 20

queries:
  # ── 피규어 ─────────────────────────────────────────
  - {q: "nendoroid hatsune miku", category: 피규어, series: 보컬로이드, group: nendo-miku}
  - {q: "nendoroid saber", category: 피규어, series: Fate, group: nendo-saber}
  - {q: "nendoroid", category: 피규어, pages: 2}
  - {q: "figma hatsune miku", category: 피규어, series: 보컬로이드, group: figma-miku}
  - {q: "figma saber", category: 피규어, series: Fate, group: figma-saber}
  - {q: "figma figure", category: 피규어}
  - {q: "revoltech danboard", category: 피규어, series: 요츠바랑!, group: revoltech-danboard}
  - {q: "danbo amazon figure", category: 피규어, series: 요츠바랑!, group: revoltech-danboard}
  - {q: "scale figure anime", category: 피규어}
  - {q: "s.h.figuarts goku", category: 피규어, series: 드래곤볼, group: shf-goku}
  - {q: "dragon ball figure", category: 피규어, series: 드래곤볼}
  - {q: "one piece luffy figure", category: 피규어, series: 원피스, group: luffy-figure}
  - {q: "evangelion unit 01 figure", category: 피규어, series: 에반게리온, group: eva01-figure}
  - {q: "rei ayanami figure", category: 피규어, series: 에반게리온, group: rei-figure}
  - {q: "totoro figure", category: 피규어, series: 이웃집 토토로}
  - {q: "pikachu figure", category: 피규어, series: 포켓몬스터}
  - {q: "sailor moon figure", category: 피규어, series: 세일러문}

  # ── 프라모델 ───────────────────────────────────────
  - {q: "gunpla rx-78-2", category: 프라모델, series: 건담, group: gunpla-rx78}
  - {q: "gunpla zaku", category: 프라모델, series: 건담, group: gunpla-zaku}
  - {q: "gunpla unicorn gundam", category: 프라모델, series: 건담, group: gunpla-unicorn}
  - {q: "gunpla", category: 프라모델, series: 건담, pages: 2}
  - {q: "HG gundam model", category: 프라모델, series: 건담}
  - {q: "SD gundam model kit", category: 프라모델, series: 건담}
  - {q: "gundam model kit box", category: 프라모델, series: 건담}
  - {q: "evangelion model kit", category: 프라모델, series: 에반게리온}

  # ── 아크릴 스탠드 ──────────────────────────────────
  - {q: "acrylic stand anime", category: 아크릴 스탠드}
  - {q: "acrylic standee character", category: 아크릴 스탠드}
  - {q: "acrylic keychain anime", category: 아크릴 스탠드}
  - {q: "anime standee", category: 아크릴 스탠드}

  # ── 랜덤 굿즈/뱃지 ─────────────────────────────────
  - {q: "can badge anime", category: 랜덤 굿즈/뱃지}
  - {q: "anime pin badge", category: 랜덤 굿즈/뱃지}
  - {q: "blind box figure", category: 랜덤 굿즈/뱃지}
  - {q: "gashapon capsule toy", category: 랜덤 굿즈/뱃지}
  - {q: "sonny angel", category: 랜덤 굿즈/뱃지, series: 소니엔젤, group: sonny-angel}
  - {q: "bearbrick", category: 랜덤 굿즈/뱃지, series: 베어브릭, group: bearbrick}
