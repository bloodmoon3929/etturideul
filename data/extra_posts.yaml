# Task 1·2("가장 싸게 파는 게시물 찾기")를 위한 게시물. make_dummy.py가 draft_curation.json의 게시물에 더한다.
#
# - Task 대상 굿즈(세이버 피그마, 리볼텍 단보)는 가격·문구를 다르게 여러 개 올린다.
#   실제로 가장 싼 게시물은 제목에 상품 이름이 없다("피규어 팝니다", "물건 팝니다").
# - 판매가와 본문 금액이 다른 게시물(가격을 본문에서만 내림), 판매가 1원짜리 일괄 판매 게시물을 섞는다.
# - image: 사진 id. "img_0100_a1"처럼 _aN이 붙은 것은 scripts/augment_images.py가 만든 증강 사진이다(다른 판매자가 찍은 것처럼 보이게).
# - real_prices: 평가용 실제 가격. 본문 가격이 실제 가격인 게시물과 일괄 판매 게시물에만 적는다(없으면 판매가가 실제 가격).
# - overrides: draft_curation.json에 있던 게시물의 값을 고친다(사진 id 기준).

overrides:
  img_0058: {price: 31000}

