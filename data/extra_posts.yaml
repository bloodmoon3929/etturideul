# Task 1~3("가장 싸게 살 수 있는 게시물 고르기")를 위한 게시물. make_dummy.py가 draft_curation.json의 게시물에 더한다.
#
# Task 대상 굿즈 세 개(세이버 피그마, 리볼텍 단보, RG 건담)는 같은 구조로 여러 개 올린다.
#   - 제목에 상품 이름이 없는 게시물("피규어 팝니다" 등): 판매가가 낮은 편. 사진 검색이 있어야 찾기 쉽다
#   - 본문에서만 가격을 내린 게시물: 판매가는 중간인데 본문 가격이 가장 낮다. 가격 확인 안내가 있어야 알아채기 쉽다
#   - 판매가 1원 일괄 판매: 본문에 상품별 가격이 있다
#   - 그 밖의 일반 게시물 2~3개
# 정답·오답은 매기지 않는다. 앱은 고른 게시물과 그 판매가·실제 가격·대상의 최저 실제 가격을 참고로 남긴다.
# - image: 사진 id. "img_0100_a1"처럼 _aN이 붙은 것은 scripts/augment_images.py가 만든 증강 사진이다(다른 판매자가 찍은 것처럼 보이게).
# - real_prices: 평가용 실제 가격. 본문 가격이 실제 가격인 게시물과 일괄 판매 게시물에만 적는다(없으면 판매가가 실제 가격).
# - overrides: draft_curation.json에 있던 게시물의 값을 고친다(사진 id 기준).

